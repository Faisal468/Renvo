# Save as /etc/nginx/sites-available/api.renovvo.com, then:
#   ln -s /etc/nginx/sites-available/api.renovvo.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.renovvo.com     (adds HTTPS automatically)
server {
    listen 80;
    server_name api.renovvo.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
